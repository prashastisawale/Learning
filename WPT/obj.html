<!DOCTYPE html>
<html>
    <head>
        <title>Define Object that contains variables</title>
    </head>
    <body>
        <h2>Define Object </h2>
        <script>
           
            var person = {
                name: "John",
                age: 30,
                
            };

            var Product = {
                name: "Laptop",
                price: 1000,
            };

         
            document.write("Name: " + person.name + "<br>");
            document.write("Age: " + person.age + "<br>");

            document.write("<br>");

            document.write("Product Name: " + Product.name + "<br>");
            document.write("Product Price: " + Product.price + "<br>");
        </script>
          
    </body>
</html>
