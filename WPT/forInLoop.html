<!DOCTYPE html>
<html>
    <head>
    <title>For In Loop</title>
    </head>
    <body>
        <script>
            let b = {
                id:100,
                name:"abc",
                email:"abc@gmail.com"
            }
            for(let key in b){
                console.log(key + ": " + b[key]);
            }

        </script>
    </body>
</html>
